
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Categorias - Sabor da Casa</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <a href="index.html" class="logo">Sabor da Casa</a>

      <nav class="navegacao">
        <a href="index.html">Cardápio</a>
        <a href="categoria-form.html" aria-current="page">Nova categoria</a>
        <a href="prato-form.html">Novo prato</a>
      </nav>
    </div>
  </header>

  <main class="container secao-formulario">

    <a href="index.html" class="voltar">← Voltar ao cardápio</a>

    <h1 id="titulo-formulario">Cadastro de categorias</h1>
    <p>Organize os pratos do nosso cardápio.</p>

    <form id="form-categoria">

      <input type="hidden" id="categoria-id">

      <div class="campo">
        <label for="nome">Nome da categoria</label>
        <input
          type="text"
          id="nome"
          maxlength="80"
          required
          placeholder="Ex.: Pratos executivos"
        >
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea
          id="descricao"
          maxlength="200"
          placeholder="Descreva esta categoria"
        ></textarea>
      </div>

      <div class="acoes-formulario">
        <button type="submit" class="botao">Salvar categoria</button>
        <a href="index.html" class="botao botao-secundario">Cancelar</a>
      </div>

      <div id="mensagens" role="status" aria-live="polite" hidden></div>

    </form>

  </main>

  <footer class="rodape">
    <p>Menu de Marmitaria - Cardápio digital</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/mensagens.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/categoria-form.js"></script>

</body>
</html>
